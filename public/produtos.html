<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-container">
    <div class="top-bar">
        <h2>Cadastro de Produtos</h2>
        <a href="index.html" class="btn btn-secondary">Voltar ao Menu Principal</a>
    </div>

    <div class="form-card">
        <h3 id="formTitle">Novo Produto</h3>
        <input type="hidden" id="prodId">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </div>
        <div class="form-group">
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao">
        </div>
        <div class="form-group">
            <label for="custo">Custo (R$):</label>
            <input type="number" step="0.01" id="custo">
        </div>
        <div class="form-group">
            <label for="qtd_estoque">Qtd em Estoque:</label>
            <input type="number" id="qtd_estoque">
        </div>
        <div class="form-group">
            <label for="qtd_minima">Estoque Mínimo:</label>
            <input type="number" id="qtd_minima">
        </div>
        <button class="btn btn-success" onclick="salvarProduto()">Salvar</button>
        <button class="btn btn-secondary" onclick="limparFormulario()">Cancelar</button>
    </div>

    <hr>
    
    <div class="form-group">
        <h3>Listagem de Produtos</h3>
        <input type="text" id="busca" placeholder="Buscar por termo..." onkeyup="filtrarTabela()">
    </div>
    
    <table id="tabelaProdutos">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Custo</th>
                <th>Estoque</th>
                <th>Mínimo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let todosProdutos = [];

        async function carregarProdutos() {
            const res = await fetch('/api/produtos');
            todosProdutos = await res.json();
            renderTabela(todosProdutos);
        }

        function renderTabela(lista) {
            const tbody = document.querySelector('#tabelaProdutos tbody');
            tbody.innerHTML = '';
            lista.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nome}</td>
                        <td>${p.descricao || ''}</td>
                        <td>R$ ${parseFloat(p.custo).toFixed(2)}</td>
                        <td>${p.qtd_estoque}</td>
                        <td>${p.qtd_minima}</td>
                        <td>
                            <button class="btn btn-primary" onclick="editarProduto(${p.id})">Editar</button>
                            <button class="btn btn-danger" onclick="excluirProduto(${p.id})">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filtrarTabela() {
            const termo = document.getElementById('busca').value.toLowerCase();
            const filtrados = todosProdutos.filter(p => 
                p.nome.toLowerCase().includes(termo) || 
                (p.descricao && p.descricao.toLowerCase().includes(termo))
            );
            renderTabela(filtrados);
        }

        async function salvarProduto() {
            const id = document.getElementById('prodId').value;
            const nome = document.getElementById('nome').value;
            const descricao = document.getElementById('descricao').value;
            const custo = parseFloat(document.getElementById('custo').value);
            const qtd_estoque = parseInt(document.getElementById('qtd_estoque').value);
            const qtd_minima = parseInt(document.getElementById('qtd_minima').value);

            if (!nome || isNaN(custo) || isNaN(qtd_estoque) || isNaN(qtd_minima)) {
                alert('Preencha os campos obrigatórios corretamente.');
                return;
            }

            const url = id ? `/api/produtos/${id}` : '/api/produtos';
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, descricao, custo, qtd_estoque, qtd_minima })
            });

            if (res.ok) {
                alert('Salvo com sucesso!');
                limparFormulario();
                carregarProdutos();
            } else {
                const data = await res.json();
                alert('Erro: ' + data.message);
            }
        }

        function editarProduto(id) {
            const p = todosProdutos.find(item => item.id === id);
            if (p) {
                document.getElementById('prodId').value = p.id;
                document.getElementById('nome').value = p.nome;
                document.getElementById('descricao').value = p.descricao;
                document.getElementById('custo').value = p.custo;
                document.getElementById('qtd_estoque').value = p.qtd_estoque;
                document.getElementById('qtd_minima').value = p.qtd_minima;
                document.getElementById('formTitle').textContent = 'Editar Produto';
            }
        }

        async function excluirProduto(id) {
            if (confirm('Deseja realmente excluir este produto?')) {
                const res = await fetch(`/api/produtos/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    carregarProdutos();
                } else {
                    alert('Erro ao excluir produto.');
                }
            }
        }

        function limparFormulario() {
            document.getElementById('prodId').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('descricao').value = '';
            document.getElementById('custo').value = '';
            document.getElementById('qtd_estoque').value = '';
            document.getElementById('qtd_minima').value = '';
            document.getElementById('formTitle').textContent = 'Novo Produto';
        }

        carregarProdutos();
    </script>
</body>
</html>
